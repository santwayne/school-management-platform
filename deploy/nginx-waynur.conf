# Serve the BUILT frontend (frontend/dist) — never `npm run dev`/vite dev in production.
# Build:  cd frontend && npm ci && npm run build   → copies to /var/www/waynur
server {
    listen 80;
    server_name waynur.com www.waynur.com;

    root /var/www/waynur;
    index index.html;

    # API → Node backend (PM2, port 5000)
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }

    # Hashed assets: cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Blog posts: link-preview crawlers don't run JavaScript, so they get a
    # small server-rendered page with the post's title/description/image.
    # Everyone else gets the React app.
    location ~ "^/blog/([a-z0-9-]+)/?$" {
        if ($http_user_agent ~* "facebookexternalhit|Facebot|WhatsApp|Twitterbot|LinkedInBot|Slackbot|TelegramBot|Discordbot|Pinterest") {
            rewrite "^/blog/([a-z0-9-]+)/?$" /api/public/blog/$1/preview last;
        }
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    # SPA routes
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
