# Serve the BUILT frontend (frontend/dist) — never `npm run dev`/vite dev in production.
# Build:  cd frontend && npm ci && npm run build   → copies to /var/www/waynur
#   `npm run build` also pre-renders the public pages into dist/<route>/index.html
#   and writes dist/spa.html (the plain app shell used as the SPA fallback).
server {
    listen 80;
    server_name waynur.com www.waynur.com;

    root /var/www/waynur;
    index index.html;

    # API → Node backend (PM2, port 5000)
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 16m;
        # AI calls (answer-sheet grading, Ask AI) can take longer than nginx's
        # default 60 s.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # Hashed assets: cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Blog → Express renders real HTML (title, meta, H1, article, JSON-LD) for
    # every visitor and crawler; unknown slugs get a real 404, renamed slugs a
    # 301. /blog-admin is NOT matched here (it stays in the SPA below).
    location ~ ^/blog(/.*)?$ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors off;
    }

    # One sitemap for the whole site, generated by the backend.
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
    }

    # Old marketing URLs → new feature pages (backlinks keep their value).
    location = /fees       { return 301 /features/fee-management; }
    location = /parent-app { return 301 /features/whatsapp-parent-alerts; }
    location = /exams      { return 301 /features/exam-results-to-parents; }

    # Pre-rendered public pages first (dist/pricing/index.html …), then the
    # SPA shell for app routes (login, dashboards). spa.html is the shell
    # WITHOUT home-page content, so /dashboard doesn't flash the home page.
    location / {
        # One URL form only: /pricing/ → /pricing
        rewrite ^/(.+)/$ /$1 permanent;
        try_files $uri $uri/index.html /spa.html;
        add_header Cache-Control "no-cache";
    }
}
